name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0)'
        required: true
        default: '1.0.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if gh api repos/${{ github.repository }}/git/ref/tags/$TAG --silent 2>/dev/null; then
            echo "Tag $TAG already exists — bump the version"
            exit 1
          fi
          echo "Tag $TAG is free, proceeding"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run ktlint
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheckAll --no-daemon

  build:
    needs: [validate, lint]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Write the version into build.gradle.kts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { Write-Error "The version must look like 1.2.0"; exit 1 }
          $file = "build.gradle.kts"
          $text = Get-Content $file -Raw
          $new = [regex]::Replace($text, '(?m)^version = ".*"', "version = ""$env:RELEASE_VERSION""")
          if ($new -notmatch "(?m)^version = ""$([regex]::Escape($env:RELEASE_VERSION))""") { Write-Error "No version line in $file"; exit 1 }
          Set-Content -Path $file -Value $new -NoNewline
          Select-String -Path $file -Pattern '^version = '

      - name: Build portable zip and installer
        shell: pwsh
        run: ./gradlew :app:packagePortable :app:packageReleaseMsi "--no-daemon" "-x" "ktlintCheckAll"

      - name: Find installer
        id: find-installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "app/build/compose/binaries/main-release/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { Write-Error "Installer (.msi) not found"; exit 1 }
          "installer_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Find portable zip
        id: find-portable
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "app/build/release" -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { Write-Error "Portable zip not found"; exit 1 }
          "portable_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/compose/binaries/main-release/msi/*.msi
            app/build/release/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: artifacts/**