name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build portable zip and installer
        shell: pwsh
        run: ./gradlew :app:packagePortable :app:packageReleaseMsi "-Pversion=${{ github.event.inputs.version }}"

      - name: Find installer
        id: find-installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "app/build/compose/binaries/main-release/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { Write-Error "Installer not found"; exit 1 }
          "installer_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.find-installer.outputs.installer_path }}
            app/build/release/DayzWorkbenchTool.zip