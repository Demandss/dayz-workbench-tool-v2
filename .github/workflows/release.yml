name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0)'
        required: true
        default: '1.0.0'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag does not exist
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${context.payload.inputs.version}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              core.setFailed(`Tag ${tag} already exists — bump the version`);
            } catch (e) {
              if (e.status === 404) {
                console.log(`Tag ${tag} is free, proceeding`);
              } else {
                throw e;
              }
            }

  build:
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build portable zip and installer
        shell: pwsh
        run: ./gradlew :app:packagePortable :app:packageReleaseMsi "--no-daemon" "-Pversion=${{ github.event.inputs.version }}"

      - name: Find installer
        id: find-installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "app/build/compose/binaries/main-release/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { Write-Error "Installer (.msi) not found"; exit 1 }
          "installer_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Find portable zip
        id: find-portable
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "app/build/release" -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { Write-Error "Portable zip not found"; exit 1 }
          "portable_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            app/build/compose/binaries/main-release/msi/*.msi
            app/build/release/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          generate_release_notes: true
          files: artifacts/**